<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="/">E-Store</a>

        <form class="d-flex" method="GET" action="/">
            <input class="form-control me-2" type="search" name="search" placeholder="Search products">
            <button class="btn btn-outline-light">Search</button>
        </form>

        <div>
            {% if current_user.is_authenticated %}
                <span class="text-white me-3">
                    Welcome, {{ current_user.username }}
                </span>

                <a href="/" class="btn btn-outline-light me-2">Home</a>
                <a href="/cart" class="btn btn-light me-2">Cart ({{ cart_count }})</a>
                <a href="/wishlist" class="btn btn-warning me-2">Wishlist</a>
                <a href="/orders" class="btn btn-warning me-2">My Orders</a>
                <a href="/logout" class="btn btn-danger">Logout</a>
            {% else %}
                <a href="/login" class="btn btn-light me-2">Login</a>
                <a href="/register" class="btn btn-success">Register</a>
            {% endif %}
        </div>

    </div>
</nav>

<!-- PAGE CONTENT -->
<div class="container mt-5">
    {% block content %}{% endblock %}
</div>

</body>
</html>
