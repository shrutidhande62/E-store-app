{% extends "base.html" %}

{% block content %}

<div class="p-5 mb-5 bg-light rounded-4 text-center">
    <h1 class="display-4 fw-bold">Welcome To My E-Store</h1>

    <p class="lead mt-3">
        Discover premium electronics, gadgets and accessories
    </p>

    <a href="#products" class="btn btn-dark btn-lg mt-3">
        Shop Now
    </a>
</div>

<h1 id="products" class="text-center mb-5">Featured Products</h1>

<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">

            <img src="{{ url_for('static', filename='images/' + product.image) }}"
                 class="card-img-top"
                 height="250">

            <div class="card-body">
                <h5 class="card-title">
                    <a href="/product/{{ product.id }}"
                       style="text-decoration: none; color: black;">
                        {{ product.name }}
                    </a>
                </h5>

                <p class="card-text">₹{{ product.price }}</p>

                <a href="/add_to_cart/{{product.id}}" class="btn btn-primary">
                    Add to Cart
                </a>

                <a href="/add_to_wishlist/{{ product.id }}"
                   class="btn btn-outline-danger mt-2">
                    ❤ Wishlist
                </a>
            </div>

        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
