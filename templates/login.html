<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5" style="max-width: 500px;">

    <h1 class="mb-4">
        Login
    </h1>

    {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

    {% endif %}

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Email"
               class="form-control mb-3"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               class="form-control mb-3"
               required>

        <button class="btn btn-success w-100 mb-3">

            Login

        </button>

    </form>

    <p class="text-center">

        Don't have an account?

        <a href="/register">
            Register here
        </a>

    </p>

</div>

</body>
</html>
