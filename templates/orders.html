<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>My Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">

        My Orders

    </h1>

    <table class="table table-bordered">

        <thead>

            <tr>

                <th>Order ID</th>

                <th>Products</th>

                <th>Total Price</th>

            </tr>

        </thead>

        <tbody>

            {% for order in orders %}

            <tr>

                <td>
                    {{ order.id }}
                </td>

                <td>
                    {{ order.products }}
                </td>

                <td>
                    ₹{{ order.total_price }}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    <a href="/"
       class="btn btn-dark">

        Back To Home

    </a>

</div>

</body>
</html>
