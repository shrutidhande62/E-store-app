{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">

            <img src="{{ url_for('static', filename='images/' + product.image) }}"
                 class="img-fluid">

        </div>

        <div class="col-md-6">

            <h1>{{ product.name }}</h1>

            <h3 class="mt-3">₹{{ product.price }}</h3>

            <a href="/add_to_cart/{{ product.id }}"
               class="btn btn-primary mt-4">

                Add To Cart

            </a>

        </div>

    </div>

</div>

{% endblock %}
