<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Wishlist</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        My Wishlist
    </h1>

    {% if products %}

        <div class="row">

            {% for product in products %}

            <div class="col-md-4 mb-4">

                <div class="card h-100">

                    <img src="{{ url_for('static', filename='images/' + product.image) }}"
                         class="card-img-top"
                         height="250">

                    <div class="card-body">

                        <h5>
                            {{ product.name }}
                        </h5>

                        <p>
                            ₹{{ product.price }}
                        </p>

                        <a href="/move_to_cart/{{ product.id }}"
                           class="btn btn-dark">

                            Move To Cart

                        </a>

                        <a href="/remove_from_wishlist/{{ product.id }}"
                            class="btn btn-danger mt-2">
                            Remove
                        </a>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

    {% else %}

        <h3>No items in wishlist.</h3>

    {% endif %}

</div>

</body>
</html>
